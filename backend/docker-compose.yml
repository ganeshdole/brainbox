services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: brainbox
      POSTGRES_PASSWORD: brainbox
      POSTGRES_DB: brainbox
    volumes:
      - brainbox_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brainbox -d brainbox"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Dev only: the API runs on the host via `pnpm dev`. The containerized
  # production stack (api + migrations + Caddy) is /compose.yaml.

volumes:
  brainbox_pgdata:
