# Full production stack: `docker compose up -d --build` from the repo root.
# App config comes from backend/.env (see backend/.env.example); DATABASE_URL
# and PORT are overridden here to point at the db and Caddy's proxy target.
# Set APP_HOST / WWW_HOST / POSTGRES_PASSWORD in a root .env or the shell.
# POSTGRES_PASSWORD goes into a URL unescaped, so keep it URL-safe
# (`openssl rand -hex 24`), or set DATABASE_URL yourself with it percent-encoded.
# Local dev keeps using backend/docker-compose.yml (Postgres only).
#
# The frontends bake their URLs in at build time and default to brainbox.ganeshdole.com
# (dashboard/.env.production, marketing's built-in defaults). On any other
# host, set the VITE_* build args below in the root .env too, e.g.
#   VITE_API_URL=https://app.example.com            (dashboard -> API)
#   VITE_API_BASE_URL=https://app.example.com       (marketing waitlist -> API)
#   VITE_DASHBOARD_URL=https://app.example.com      (marketing sign-up links)
#   VITE_DEMO_WIDGET_SRC=https://app.example.com/widget.js
#   VITE_DEMO_ENDPOINT=https://app.example.com/ingest
#   VITE_DEMO_PROJECT_KEY=pk_...
# Unset ones are not passed, so the defaults apply.

# Every target shares the one build stage, so all three get the same args
# (otherwise each would rebuild it with a different cache key).
x-build: &build
  context: .
  args:
    - VITE_API_URL
    - VITE_API_BASE_URL
    - VITE_DASHBOARD_URL
    - VITE_DEMO_WIDGET_SRC
    - VITE_DEMO_ENDPOINT
    - VITE_DEMO_PROJECT_KEY

x-app-env: &app-env
  env_file: backend/.env
  environment:
    DATABASE_URL: ${DATABASE_URL:-postgres://brainbox:${POSTGRES_PASSWORD:-brainbox}@db:5432/brainbox}
    PORT: "8787"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: brainbox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brainbox}
      POSTGRES_DB: brainbox
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brainbox -d brainbox"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: { <<: *build, target: migrate }
    <<: *app-env
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    build: { <<: *build, target: api }
    <<: *app-env
    restart: unless-stopped
    volumes:
      - storage:/app/.storage
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build: { <<: *build, target: web }
    restart: unless-stopped
    environment:
      APP_HOST: ${APP_HOST:-app.localhost}
      WWW_HOST: ${WWW_HOST:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
